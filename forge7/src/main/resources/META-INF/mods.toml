modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "MIT"
issueTrackerURL = "https://github.com/zhaojiedi1992/enchantpeak/issues"
# 纯客户端 mod：Forge 1.20.5+ 支持，专用服务器直接跳过加载
clientSideOnly = true

[[mods]]
modId = "enchantpeak"
version = "${mod_version}"
displayName = "EnchantPeak"
authors = "zhaojiedi1992"
description = '''
Shows best enchantment combinations for all vanilla enchantable items in JEI.
'''
logoFile = "assets/enchantpeak/icon.png"
# 纯客户端 mod：不参与服务端版本一致性检查（专用服务器上不显示为缺失 mod）
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.enchantpeak]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.enchantpeak]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.enchantpeak]]
modId = "jei"
mandatory = false
versionRange = "[${jei_min},)"
ordering = "NONE"
side = "CLIENT"
