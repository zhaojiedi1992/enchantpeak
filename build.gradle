plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = "com.${project.mod_author}"

base {
    archivesName = project.mod_id
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // JEI
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
    }
    // REI
    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI - compileOnly，运行时可选
    modCompileOnlyApi("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")
    modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")

    // REI - compileOnly，运行时可选
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:15.0.140")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}")
    modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "fabric_loader_version": project.fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
