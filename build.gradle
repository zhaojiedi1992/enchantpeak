plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

def versionMatrix = new groovy.json.JsonSlurper().parse(file('versions/minecraft.json'))
def targetMinecraftVersion = providers.gradleProperty('target_mc')
        .orElse(versionMatrix.default as String)
        .get()
def targetVersions = versionMatrix.targets[targetMinecraftVersion]
if (targetVersions == null) {
    throw new GradleException(
            "Unsupported Minecraft target '${targetMinecraftVersion}'. " +
            "Supported targets: ${versionMatrix.targets.keySet().join(', ')}"
    )
}
targetVersions.each { key, value -> project.ext.set(key as String, value as String) }

version = project.mod_version
group = "com.${project.mod_author}"

base {
    archivesName = "${project.mod_id}-mc${project.minecraft_version}"
}

repositories {
    maven {
        name = 'AliYun Central'
        url = 'https://maven.aliyun.com/repository/central'
    }
    maven { url 'https://maven.fabricmc.net/' }
    // JEI
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
    }
    // REI
    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (project.hasProperty('use_mojang_mappings') && project.use_mojang_mappings.toBoolean()) {
        mappings loom.officialMojangMappings()
    }
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI - compileOnly，运行时可选
    if (!project.hasProperty('jei_enabled') || project.jei_enabled.toBoolean()) {
        modCompileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}")
        modCompileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric:${project.jei_version}")
    }

    // REI - compileOnly，运行时可选
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")
    modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
}

processResources {
    inputs.properties([
            version               : project.version,
            minecraft_version     : project.minecraft_version,
            fabric_loader_version : project.fabric_loader_version,
            fabric_api_min_version: project.fabric_api_min_version,
            jei_min_version       : project.jei_min_version,
            rei_min_version       : project.rei_min_version
    ])

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "fabric_loader_version": project.fabric_loader_version,
               "fabric_api_min_version": project.fabric_api_min_version,
               "jei_min_version": project.jei_min_version,
               "rei_min_version": project.rei_min_version
    }
}

tasks.register('printMinecraftVersion') {
    doLast {
        println project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
