plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

def versionMatrix = new groovy.json.JsonSlurper().parse(file('versions/minecraft.json'))
def targetMinecraftVersion = providers.gradleProperty('target_mc')
        .orElse(versionMatrix.default as String)
        .get()
def targetVersions = versionMatrix.targets[targetMinecraftVersion]
if (targetVersions == null) {
    throw new GradleException(
            "Unsupported Minecraft target '${targetMinecraftVersion}'. " +
            "Supported targets: ${versionMatrix.targets.keySet().join(', ')}"
    )
}
targetVersions.each { key, value -> project.ext.set(key as String, value as String) }

// ====== Version condition variables ======
def mcVersion = project.minecraft_version
def mcFamily = project.mc_family
def javaVersion = project.ext.java_version as int
def useMojangMappings = project.hasProperty('use_mojang_mappings') && project.use_mojang_mappings.toBoolean()

// MC 26.x is unobfuscated - set the Loom property to skip mappings
if (!useMojangMappings) {
    System.setProperty('fabric.loom.disableObfuscation', 'true')
}

version = project.mod_version
group = "com.${project.mod_author}"

base {
    archivesName = "${project.mod_id}-mc${project.minecraft_version}"
}

repositories {
    maven {
        name = 'AliYun Central'
        url = 'https://maven.aliyun.com/repository/central'
    }
    maven { url 'https://maven.fabricmc.net/' }
    // JEI
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
    }
    // REI
    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    // EMI
    maven {
        name = 'EMI'
        url = 'https://repo.sleeping.town/'
    }
}

// ====== Source set configuration for version families ======
sourceSets {
    create(mcFamily) {
        java { srcDir "src/${mcFamily}/java" }
    }
}

loom {
    if (useMojangMappings) {
        // Only create remap configurations for obfuscated Minecraft versions
        createRemapConfigurations(sourceSets[mcFamily])
    }
    mods {
        enchantpeak {
            sourceSet sourceSets.main
            sourceSet sourceSets[mcFamily]
        }
    }
}

dependencies {
    "${mcFamily}Implementation" sourceSets.main.output
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (useMojangMappings) {
        mappings loom.officialMojangMappings()
    }
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JEI - compileOnly，运行时可选
    if (!project.hasProperty('jei_enabled') || project.jei_enabled.toBoolean()) {
        if (useMojangMappings) {
            modCompileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}")
            modCompileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric:${project.jei_version}")
        } else {
            compileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}")
            compileOnly("mezz.jei:jei-${project.jei_minecraft_version}-fabric:${project.jei_version}")
        }
    }

    // REI - compileOnly，运行时可选
    if (useMojangMappings) {
        modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
        modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
        modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")
        modCompileOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
    } else {
        compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
        compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
        compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")
        compileOnly("dev.architectury:architectury-fabric:${project.architectury_version}")
    }

    // EMI - compileOnly，运行时可选
    // EMI may not be available in all environments, skip if emi_version is not set
    if (project.hasProperty('emi_version') && project.emi_version != null && !project.emi_version.isEmpty()) {
        if (useMojangMappings) {
            modCompileOnly("dev.emi:emi-fabric:${project.emi_version}")
        } else {
            compileOnly("dev.emi:emi-fabric:${project.emi_version}")
        }
    }
}

processResources {
    def props = [
            version               : project.version,
            minecraft_version     : project.minecraft_version,
            fabric_loader_version : project.fabric_loader_version,
            fabric_api_min_version: project.fabric_api_min_version,
            jei_min_version       : project.jei_min_version,
            rei_min_version       : project.rei_min_version
    ]
    if (project.hasProperty('emi_min_version')) {
        props.put('emi_min_version', project.emi_min_version)
    }
    inputs.properties(props)

    filesMatching("fabric.mod.json") {
        def expandProps = [
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "fabric_loader_version": project.fabric_loader_version,
                "fabric_api_min_version": project.fabric_api_min_version,
                "jei_min_version": project.jei_min_version,
                "rei_min_version": project.rei_min_version
        ]
        if (project.hasProperty('emi_min_version')) {
            expandProps.put('emi_min_version', project.emi_min_version)
        }
        expand expandProps
    }
}

tasks.register('printMinecraftVersion') {
    doLast {
        println project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
