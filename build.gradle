plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

def versionMatrix = new groovy.json.JsonSlurper().parse(file('versions/minecraft.json'))
def targetMinecraftVersion = providers.gradleProperty('target_mc')
        .orElse(versionMatrix.default as String)
        .get()
def targetVersions = versionMatrix.targets[targetMinecraftVersion]
if (targetVersions == null) {
    throw new GradleException(
            "Unsupported Minecraft target '${targetMinecraftVersion}'. " +
            "Supported targets: ${versionMatrix.targets.keySet().join(', ')}"
    )
}
targetVersions.each { key, value -> project.ext.set(key as String, value as String) }

// ====== Version condition variables ======
def mcVersion = project.minecraft_version
def mcFamily = project.mc_family
def javaVersion = project.ext.java_version as int
def useMojangMappings = project.hasProperty('use_mojang_mappings') && project.use_mojang_mappings.toBoolean()

// Capitalize first letter for Loom's generated configuration names:
// source set "mc26" → configurations "modMc26CompileOnly" etc.
static String cap(String s) { s.isEmpty() ? s : s.substring(0, 1).toUpperCase() + s.substring(1) }

group = "com.${project.mod_author}"

// 使用 jar_name_suffix（范围标识）而非 jar_mc_version（簇代表版本）：
// 例如：构建用 1.19.2，suffix 为 "1.19.2-1.19.4"，jar 名与 mod 元数据版本均为
// enchantpeak-fabric-1.0.14+mc1.19.2-1.19.4（社区命名规范）
def jarSuffix = project.hasProperty('jar_name_suffix') ? project.jar_name_suffix : project.minecraft_version

// project.version 未赋值时 fabric.mod.json 的 ${version} 会展开成 "unspecified"
version = "${project.mod_version}+mc${jarSuffix}"

base {
    archivesName = "${project.mod_id}-fabric"
}

repositories {
    if (providers.gradleProperty('use_aliyun_mirror').map { it.toBoolean() }.getOrElse(false)) {
        // 国内镜像加速（可选）：./gradlew build -Puse_aliyun_mirror=true
        maven { url = 'https://maven.aliyun.com/repository/central' }
    }
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    // JEI
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
    }
    // REI
    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

// ====== Source set configuration for version families ======
sourceSets {
    create(mcFamily) {
        java { srcDir "src/${mcFamily}/java" }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

loom {
    if (useMojangMappings) {
        // Only create remap configurations for obfuscated Minecraft versions
        createRemapConfigurations(sourceSets[mcFamily])
    }
    mods {
        enchantpeak {
            sourceSet sourceSets.main
            sourceSet sourceSets[mcFamily]
        }
    }
}

dependencies {
    // Version-family code depends on main's shared classes (common records, mod entrypoint)
    "${mcFamily}Implementation" sourceSets.main.output

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mappings configuration
    if (useMojangMappings) {
        // MC 1.21.x and earlier use official Mojang mappings
        mappings loom.officialMojangMappings()
    } else {
        // MC 26.x is pre-deobfuscated - Fabric publishes a fixed empty
        // intermediary (version 0.0.0) for these versions, not one per MC version
        mappings "net.fabricmc:intermediary:0.0.0:v2"
    }

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    // fabric-api：mod 本身不直接引用；REI/JEI 才需要它（fabric.mod.json 已声明 suggests）

    // JEI - compileOnly for version-specific source set，运行时可选
    // Obfuscated targets (1.21.x): Loom's createRemapConfigurations() generates
    // "mod<Family>CompileOnly" which remaps mod deps into named mappings.
    // Pre-deobfuscated targets (26.x): plain compileOnly is correct.
    String modCfg = useMojangMappings ? "mod${cap(mcFamily)}CompileOnly" : "compileOnly"
    if (!project.hasProperty('jei_enabled') || project.jei_enabled.toBoolean()) {
        "${modCfg}"("mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}")
        if (project.hasProperty('jei_runtime_enabled') && project.jei_runtime_enabled.toBoolean()) {
            // 运行时模块：1.18.2 的 10.6.1 未发布 core/lib/gui（仅到 10.2.1），不可解析
            "${modCfg}"("mezz.jei:jei-${project.jei_minecraft_version}-fabric:${project.jei_version}")
        }
    }

    // REI - compileOnly for version-specific source set，运行时可选
    "${modCfg}"("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
    "${modCfg}"("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}")
    "${modCfg}"("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}")
    "${modCfg}"("dev.architectury:architectury-fabric:${project.architectury_version}")

    // 测试需要看到当前版本族的类与 Minecraft 依赖
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation sourceSets[mcFamily].output
}

// MC 26.x is pre-deobfuscated (empty mappings) - sources jar has no "named"
// namespace to remap into, so skip the sources remap task for those targets
if (!useMojangMappings) {
    tasks.named('remapSourcesJar') { enabled = false }
}

processResources {
    // JEI 未适配的版本（jei_enabled=false）不声明 jei entrypoint，否则类缺失会崩
    def hasJei = !project.hasProperty('jei_enabled') || project.jei_enabled.toBoolean()
    def jeiEntrypoint = hasJei ? ',\n    "jei_mod_plugin": [\n      "com.zhaojiedi1992.enchantpeak.jei.JeiEnchantPlugin"\n    ]' : ''
    // 整行注入：jei 未启用的目标不产生空字符串的 "jei" 键（空 semver 范围同样非法）
    def jeiSuggest = hasJei ? ",\n    \"jei\": \">=${project.jei_min_version}\"" : ''
    // minecraft 依赖必须覆盖整个版本簇（game_versions 数组，OR 语义），
    // 只写代表构建版本会把同簇其他版本挡在 loader 依赖检查之外/之外
    def gameVersions = versionMatrix.targets[targetMinecraftVersion].game_versions
    def props = [
            jei_entrypoint        : jeiEntrypoint,
            jei_suggest           : jeiSuggest,
            minecraft_versions    : gameVersions.collect { "\"${it}\"" }.join(', '),
            version               : project.version,
            minecraft_version     : project.minecraft_version,
            fabric_loader_version : project.fabric_loader_version,
            fabric_api_min_version: project.fabric_api_min_version,
            jei_min_version       : project.jei_min_version,
            rei_min_version       : project.rei_min_version,
            java_version          : project.java_version,
    ]
    inputs.properties(props)

    filesMatching("fabric.mod.json") {
        def expandProps = props.collectEntries { key, value -> [key, value.toString()] }
        expand expandProps
    }
}

tasks.register('printMinecraftVersion') {
    doLast {
        println project.minecraft_version
    }
}

test {
    useJUnitPlatform()
    // LangCoverageTest 通过该属性定位当前版本族的源码目录
    systemProperty 'enchantpeak.familyDir', "src/${mcFamily}/java"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    withSourcesJar()
}

jar {
    // Include the active version family's compiled classes (EnchantmentData,
    // JEI/REI plugins, EnchantStacks) alongside main's shared classes
    from sourceSets[mcFamily].output
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

sourcesJar {
    from sourceSets[mcFamily].allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
