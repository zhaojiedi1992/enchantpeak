modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/zhaojiedi1992/enchantpeak/issues"

[[mods]]
modId = "enchantpeak"
version = "${mod_version}"
displayName = "EnchantPeak"
authors = "zhaojiedi1992"
description = '''
Shows best enchantment combinations for all vanilla enchantable items in JEI.
'''
logoFile = "assets/enchantpeak/icon.png"

[[dependencies.enchantpeak]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_min},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.enchantpeak]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.enchantpeak]]
modId = "jei"
type = "optional"
versionRange = "[${jei_min},)"
ordering = "NONE"
side = "CLIENT"
