plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'maven-publish'
}

// mod_version/id/author 以仓库根 gradle.properties 为单一事实来源（push.sh 只更新根目录）
def rootProps = new Properties()
rootProps.load(new FileInputStream(file('../gradle.properties')))
ext.rootModVersion = rootProps.getProperty('mod_version')

// NeoForge 独立目标映射：键为 NeoForge 簇代表版本（与 Fabric 主项目矩阵解耦，
// 因为 NeoForge 簇的构建用 MC 版本与 Fabric 簇不同，如 1.21.8 vs 1.21.6）
// 字段：neoforge(平台版本) mc_family(源码家族) mc(构建用MC) suffix(jar后缀) jei/jei_mc(java版本)
def targetMinecraftVersion = providers.gradleProperty('target_mc')
        .orElse('26.2')
        .get()

def neoforgeMap = new groovy.json.JsonSlurper().parse(file('targets.json'))
def neoforgeTarget = neoforgeMap[targetMinecraftVersion]
if (neoforgeTarget == null) {
    throw new GradleException(
            "Target '${targetMinecraftVersion}' has no NeoForge mapping. " +
            "NeoForge-supported clusters: ${neoforgeMap.keySet().join(', ')}"
    )
}

def mcFamily = neoforgeTarget.mc_family
def javaVersion = (neoforgeTarget.java ?: 21) as int
def neoforgeVersion = neoforgeTarget.neoforge
def jeiVersion = neoforgeTarget.jei
def jeiMc = neoforgeTarget.jei_mc

// 依赖范围下界：取簇 NeoForge/JEI 构建版本的主.次.修订（去掉补丁号），
// 例如 21.1.248 -> [21.1,)，与 Fabric 侧 jei_min_version 的粒度一致
static String minorBound(String v) { v.replaceFirst(/\.\d+$/, '') }

group = "com.${rootProps.getProperty('mod_author')}"

base {
    archivesName = "${rootProps.getProperty('mod_id')}-neoforge"
}

// jar 名对齐社区规范：<modid>-neoforge-<modver>+mc<范围>.jar
version = rootModVersion + '+mc' + neoforgeTarget.suffix

repositories {
    if (providers.gradleProperty('use_aliyun_mirror').map { it.toBoolean() }.getOrElse(false)) {
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
    mavenCentral()
    maven { url 'https://maven.blamejared.com' }        // JEI
    maven { url 'https://maven.neoforged.net/releases' }
}

// 每个版本簇一个 source set，目录名 = 主项目同款 mcFamily（代码从主项目同步生成）
sourceSets {
    create(mcFamily) {
        java { srcDir "src/${mcFamily}/java" }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// 家族代码依赖 main 的输出（EnchantPeakMod、common record 类）
dependencies {
    "${mcFamily}Implementation" sourceSets.main.output
}
// EnchantPeakMod 入口类放在各版本族源集（src/<family>/java）：
// 新 FML（20.6+）用 @Mod(dist = Dist.CLIENT) 标记 client-only；
// 1.20.4 的 FML loader 2.x 不支持 dist 属性，该族用不带 dist 的副本

dependencies {
    implementation "net.neoforged:neoforge:${neoforgeVersion}"

    // JEI NeoForge（各簇的适配版本来自 neoforgeMap）
    implementation "mezz.jei:jei-${jeiMc}-neoforge-api:${jeiVersion}"
    runtimeOnly "mezz.jei:jei-${jeiMc}-neoforge:${jeiVersion}"
}

// mods.toml 中的占位符按簇展开：minecraft 范围来自 targets.json 的 mc_range，
// 版本下界取各依赖构建版本的主.次
processResources {
    def props = [
            mod_version    : project.version,
            mc_range       : neoforgeTarget.mc_range,
            neoforge_min   : minorBound(neoforgeVersion),
            jei_min        : minorBound(jeiVersion),
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaVersion
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
}

jar {
    from sourceSets[mcFamily].output
    // MIT 要求分发副本携带版权声明（与 Fabric 侧 build.gradle 的 jar 一致）
    from('../LICENSE') {
        rename { "${it}_${project.name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : rootProps.getProperty('mod_id'),
                'Specification-Vendor'  : rootProps.getProperty('mod_author'),
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : rootProps.getProperty('mod_author'),
        ])
    }
}

// CI/本地构建只需要 jar：跳过 run 时的 assets 下载（neoFormJoined DownloadAssets 常因网络卡住）
tasks.matching { it.name.contains('DownloadAssets') }.configureEach {
    onlyIf { false }
}
