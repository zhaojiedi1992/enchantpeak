name: E2E Smoke

# 无头客户端端到端冒烟测试：用 mc-runtime-test（HeadlessMc）以真实启动器
# 方式启动客户端、自动进世界，再按日志标记断言 JEI/REI 集成与（26.2 的）
# harness API 级断言。全 21 目标跑太贵，这里只跑每个版本族 × loader 的代表。
#
# 触发：手动（workflow_dispatch）与打 tag 发布时自动执行。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Fabric 代表 ----
          - { name: fabric-26.2,  loader: fabric,   mc: "26.2",    target: "26.2",  gradle_java: 25, runtime_java: 25, e2e: "true"  }
          - { name: fabric-1.21.9, loader: fabric,  mc: "1.21.11", target: "1.21.9", gradle_java: 21, runtime_java: 21, e2e: "false" }
          - { name: fabric-1.21.4, loader: fabric,  mc: "1.21.4",  target: "1.21.4", gradle_java: 21, runtime_java: 21, e2e: "false", rei_only: "true" }
          - { name: fabric-1.20.4, loader: fabric,  mc: "1.20.4",  target: "1.20.4", gradle_java: 21, runtime_java: 17, e2e: "false" }
          # 1.18.2 暂不冒烟：mc-runtime-test 的自动退出 mod 在 1.18.2 上不生效，
          # 游戏不退出导致 job 超时（数据正确性已由 JVM 深测覆盖，1.20.4 代表旧 API 时代）
          # ---- NeoForge 代表 ----
          - { name: neoforge-26.2,   loader: neoforge, mc: "26.2",    target: "26.2",  gradle_java: 21, runtime_java: 25, e2e: "false" }
          - { name: neoforge-1.21.9, loader: neoforge, mc: "1.21.11", target: "1.21.9", gradle_java: 21, runtime_java: 21, e2e: "false" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NeoForge 的 Gradle 8.14 不支持 Java 25：先装 25 供 toolchain，再装 21 作为默认
      - name: Set up JDK 25 (toolchain for MC 26.x)
        if: matrix.name == 'neoforge-26.2'
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Set up JDK ${{ matrix.gradle_java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.gradle_java }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar (Fabric)
        if: matrix.loader == 'fabric'
        run: |
          if [ "${{ matrix.e2e }}" = "true" ]; then
            ./gradlew build e2eJar --no-daemon -Ptarget_mc=${{ matrix.target }} -Pe2e
          else
            ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.target }}
          fi

      - name: Build mod jar (NeoForge)
        if: matrix.loader == 'neoforge'
        working-directory: neoforge
        run: ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.target }}

      - name: Stage mods into run/mods
        run: |
          rm -rf run/mods && mkdir -p run/mods
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            ./gradlew stageE2eMods --no-daemon -Ptarget_mc=${{ matrix.target }}
          else
            (cd neoforge && ./gradlew stageE2eMods --no-daemon -Ptarget_mc=${{ matrix.target }})
          fi
          echo "staged mods:" && ls -la run/mods

      - name: Run headless Minecraft client
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          mc-runtime-test: ${{ matrix.loader }}
          java: ${{ matrix.runtime_java }}
          xvfb: "true"

      - name: Assert EnchantPeak markers in client log
        run: |
          # 正则用单引号传递（单引号内反斜杠原样保留，绕开 shell/YAML 双重转义）
          if [ "${{ matrix.rei_only }}" = "true" ]; then
            printf '%s\n' \
              '\[EnchantPeak\] Initialized\.' \
              'REI displays registered: \d+ info, \d+ custom' \
              'REI entries added: \d+' > /tmp/e2e-require.txt
          elif [ "${{ matrix.e2e }}" = "true" ]; then
            printf '%s\n' \
              '\[EnchantPeak\] Initialized\.' \
              'JEI recipes registered: \d+' \
              'REI displays registered: \d+ info, \d+ custom' \
              'REI entries added: \d+' \
              '\[EnchantPeak E2E\] RESULT: OK' > /tmp/e2e-require.txt
          elif [ "${{ matrix.loader }}" = "neoforge" ]; then
            printf '%s\n' \
              '\[EnchantPeak\] NeoForge mod initialized\.' \
              'JEI recipes registered: \d+' > /tmp/e2e-require.txt
          else
            printf '%s\n' \
              '\[EnchantPeak\] Initialized\.' \
              'JEI recipes registered: \d+' \
              'REI displays registered: \d+ info, \d+ custom' \
              'REI entries added: \d+' > /tmp/e2e-require.txt
          fi
          printf '%s\n' \
            '注册失败' \
            '当前注册表中缺失' \
            'RESULT: FAIL' > /tmp/e2e-forbid.txt
          python3 scripts/assert_e2e_log.py --require-file /tmp/e2e-require.txt --forbid-file /tmp/e2e-forbid.txt

      - name: Upload client log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/**/latest.log
            **/latest.log
            run/logs/latest.log
          if-no-files-found: ignore
          retention-days: 14
