name: Build

# 每次 push 到任意分支 或 PR 时触发，只做构建验证，不发布
on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: enchantpeak-jar
          path: build/libs/*.jar
          retention-days: 14
