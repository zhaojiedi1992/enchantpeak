name: Build

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read supported Minecraft versions and Java requirements
        id: matrix
        run: |
          MATRIX=$(jq -c '.targets | to_entries | map({minecraft: .key, java: (.value.java_version | tonumber)})' versions/minecraft.json)
          echo "value=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (runner JDK for Gradle/Loom)
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      # Runner JDK must be >= 21 for fabric-loom 1.17+, and MC 26.x requires
      # the Gradle JVM itself to be Java 25. Gradle toolchain auto-provisions
      # the exact compile JDK per target (17 for 1.18-1.20, 21 for 1.21.x, 25 for 26.x).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft ${{ matrix.minecraft }}
        run: ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.minecraft }}

      - name: Verify Minecraft ${{ matrix.minecraft }} enchantment data
        run: python3 scripts/verify_enchants.py --minecraft-version ${{ matrix.minecraft }}

      - name: Upload Minecraft ${{ matrix.minecraft }} jar
        uses: actions/upload-artifact@v4
        with:
          name: enchantpeak-mc${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
