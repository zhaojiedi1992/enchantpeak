name: Build

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read supported Minecraft versions
        id: matrix
        run: echo "value=$(jq -c '.targets | keys' versions/minecraft.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft ${{ matrix.minecraft }}
        run: ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.minecraft }}

      - name: Verify Minecraft ${{ matrix.minecraft }} enchantment data
        run: python3 scripts/verify_enchants.py --minecraft-version ${{ matrix.minecraft }}

      - name: Upload Minecraft ${{ matrix.minecraft }} jar
        uses: actions/upload-artifact@v4
        with:
          name: enchantpeak-mc${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
