name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 发布也可能由手动 git tag + push 触发（不经过 push.sh），漂移检查必须在这里再拦一次
  family-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Fabric/NeoForge family sources are in sync
        run: python3 scripts/sync_family_sources.py --check

  release-info:
    needs: family-sync
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.info.outputs.matrix }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release information
        id: info
        run: |
          PROJECT_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          RELEASE_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PROJECT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Tag version $RELEASE_VERSION does not match mod_version $PROJECT_VERSION" >&2
            exit 1
          fi
          echo "matrix=$(jq -c '.targets | keys' versions/minecraft.json)" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: release-info
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.release-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft ${{ matrix.minecraft }}
        run: ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.minecraft }}

      - name: Verify Minecraft ${{ matrix.minecraft }} enchantment data
        run: python3 scripts/verify_enchants.py --minecraft-version ${{ matrix.minecraft }}

      - name: Verify Minecraft ${{ matrix.minecraft }} jar metadata
        run: |
          mkdir -p dist && cp build/libs/*.jar dist/ && rm -f dist/*-sources.jar
          python3 scripts/verify_jars.py --dist dist

      - name: Upload Minecraft ${{ matrix.minecraft }} jar
        uses: actions/upload-artifact@v4
        with:
          name: enchantpeak-mc${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  # GitHub Release 创建（先创建空 release）
  github-release-init:
    needs: [release-info, build, neoforge-build]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EnchantPeak ${{ needs.release-info.outputs.version }}
          generate_release_notes: true
          body: |
            Artifacts are being uploaded...
          draft: false

  # NeoForge 文件上传（低版本到高版本，先上传）
  github-release-neoforge:
    needs: [release-info, neoforge-info, neoforge-build, github-release-init]
    strategy:
      max-parallel: 1  # 串行上传
      matrix:
        target: ${{ fromJSON(needs.neoforge-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download NeoForge ${{ matrix.target }} jar
        uses: actions/download-artifact@v4
        with:
          name: enchantpeak-neoforge-mc${{ matrix.target }}
          path: dist

      - name: Upload NeoForge ${{ matrix.target }} to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar

  # Fabric 文件上传（低版本到高版本，后上传，最终在顶部）
  github-release-fabric:
    needs: [release-info, build, github-release-neoforge]
    strategy:
      max-parallel: 1  # 串行上传
      matrix:
        minecraft: ${{ fromJSON(needs.release-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Fabric ${{ matrix.minecraft }} jar
        uses: actions/download-artifact@v4
        with:
          name: enchantpeak-mc${{ matrix.minecraft }}
          path: dist

      - name: Upload Fabric ${{ matrix.minecraft }} to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar

  # ===== NeoForge 构建（独立 Gradle 构建，见 neoforge/）=====
  neoforge-info:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read NeoForge target keys
        id: targets
        run: |
          TARGETS=$(jq -c 'keys' neoforge/targets.json)
          echo "value=${TARGETS}" >> "$GITHUB_OUTPUT"

  neoforge-build:
    needs: [release-info, neoforge-info]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.neoforge-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 25 先装（供 toolchain 编译 MC 26.x），21 后装（成为默认 JAVA_HOME，
      # Gradle 8.14 daemon 不支持 Java 25，必须用 21 跑）
      - name: Set 25 (toolchain target for MC 26.x)
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Set up JDK 21 (Gradle daemon)
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches/neoformruntime

      - name: Build NeoForge target ${{ matrix.target }}
        working-directory: neoforge
        run: ./gradlew build --no-daemon -Ptarget_mc=${{ matrix.target }}

      - name: Verify NeoForge ${{ matrix.target }} jar metadata
        run: |
          mkdir -p dist && cp neoforge/build/libs/*.jar dist/ && rm -f dist/*-sources.jar
          python3 scripts/verify_jars.py --dist dist

      - name: Upload NeoForge ${{ matrix.target }} jar
        uses: actions/upload-artifact@v4
        with:
          name: enchantpeak-neoforge-mc${{ matrix.target }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error

  neoforge-release:
    needs: [release-info, neoforge-info, neoforge-build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.neoforge-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NeoForge ${{ matrix.target }} jar
        uses: actions/download-artifact@v4
        with:
          name: enchantpeak-neoforge-mc${{ matrix.target }}
          path: dist

      - name: Read NeoForge game versions for ${{ matrix.target }}
        id: game-versions
        run: |
          VERSIONS=$(jq -r '.["${{ matrix.target }}"].game_versions | join("\n")' neoforge/targets.json)
          {
            echo "versions<<GAME_VERSIONS_EOF"
            echo "$VERSIONS"
            echo "GAME_VERSIONS_EOF"
            echo "java=Java $(jq -r '.["${{ matrix.target }}"].java' neoforge/targets.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog for ${{ needs.release-info.outputs.version }}
        run: |
          awk '/^## ${{ needs.release-info.outputs.version }}$/{flag=1;next} /^## /{flag=0} flag' \
            CHANGELOG.md > .gh-changelog.md
          test -s .gh-changelog.md

      - name: Publish NeoForge ${{ matrix.target }} to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Ieptg3ne
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          name: EnchantPeak NeoForge ${{ needs.release-info.outputs.version }} for MC ${{ matrix.target }}
          version: ${{ needs.release-info.outputs.version }}+neoforge-mc${{ matrix.target }}
          version-type: release
          changelog-file: .gh-changelog.md
          loaders: neoforge
          game-versions: ${{ steps.game-versions.outputs.versions }}
          java: ${{ steps.game-versions.outputs.java }}
          dependencies: |
            jei(optional){modrinth:u6dRKJwZ}

      - name: Publish NeoForge ${{ matrix.target }} to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: 1648044
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: EnchantPeak NeoForge ${{ needs.release-info.outputs.version }} for MC ${{ matrix.target }}
          version: ${{ needs.release-info.outputs.version }}+neoforge-mc${{ matrix.target }}
          version-type: release
          changelog-file: .gh-changelog.md
          loaders: neoforge
          game-versions: ${{ steps.game-versions.outputs.versions }}
          java: ${{ steps.game-versions.outputs.java }}
          dependencies: |
            jei(optional){curseforge:238222}

  platform-release:
    needs: [release-info, build]
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.release-info.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Minecraft ${{ matrix.minecraft }} jar
        uses: actions/download-artifact@v4
        with:
          name: enchantpeak-mc${{ matrix.minecraft }}
          path: dist

      - name: Read game versions for ${{ matrix.minecraft }}
        id: game-versions
        run: |
          VERSIONS=$(jq -r '.targets["${{ matrix.minecraft }}"].game_versions | join("\n")' versions/minecraft.json)
          {
            echo "versions<<GAME_VERSIONS_EOF"
            echo "$VERSIONS"
            echo "GAME_VERSIONS_EOF"
            echo "java=Java $(jq -r '.targets["${{ matrix.minecraft }}"].java_version' versions/minecraft.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog for ${{ needs.release-info.outputs.version }}
        run: |
          awk '/^## ${{ needs.release-info.outputs.version }}$/{flag=1;next} /^## /{flag=0} flag' \
            CHANGELOG.md > .gh-changelog.md
          test -s .gh-changelog.md

      - name: Publish Minecraft ${{ matrix.minecraft }} to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Ieptg3ne
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.jar
          name: EnchantPeak ${{ needs.release-info.outputs.version }} for MC ${{ matrix.minecraft }}
          version: ${{ needs.release-info.outputs.version }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog-file: .gh-changelog.md
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.game-versions.outputs.versions }}
          java: ${{ steps.game-versions.outputs.java }}
          dependencies: |
            fabric-api(optional){modrinth:P7dR8mSH}
            rei(optional){modrinth:nfn13YXA}
            jei(optional){modrinth:u6dRKJwZ}

      - name: Publish Minecraft ${{ matrix.minecraft }} to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: 1648044
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: EnchantPeak ${{ needs.release-info.outputs.version }} for MC ${{ matrix.minecraft }}
          version: ${{ needs.release-info.outputs.version }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog-file: .gh-changelog.md
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.game-versions.outputs.versions }}
          java: ${{ steps.game-versions.outputs.java }}
          dependencies: |
            fabric-api(optional){curseforge:306612}
            rei(optional){curseforge:310111}
            jei(optional){curseforge:238222}
