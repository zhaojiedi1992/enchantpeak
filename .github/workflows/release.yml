name: Build and Release

# 触发条件：push 一个 v开头的 tag，例如 v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Locate built jar
        id: jar
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Found jar: $JAR_PATH"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---- 发布到 GitHub Releases ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          name: "EnchantPeak ${{ steps.version.outputs.version }}"
          generate_release_notes: true

      # ---- 发布到 Modrinth ----
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Ieptg3ne
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: ${{ steps.jar.outputs.path }}
          name: "EnchantPeak ${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: |
            fabric
            quilt
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
          java: |
            Java 25

          dependencies: |
            fabric-api@0.157.0(required){modrinth:P7dR8mSH}
            rei(optional){modrinth:nfn13YXA}
            jei(optional){modrinth:u6dRKJwZ}
