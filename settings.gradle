pluginManagement {
    repositories {
        if (settings.providers.gradleProperty('use_aliyun_mirror').map { it.toBoolean() }.getOrElse(false)) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'enchantpeak'
